<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mess Check-In | IIT Bombay</title>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="topbar">

        <div class="brand">

            <img
                src="logo.png"
                alt="IIT Bombay Logo"
                class="iitb-logo"
            >

            <div class="brand-text">

                <strong>
                    IIT BOMBAY
                </strong>

                <span>
                    Hostel Mess
                </span>

            </div>

        </div>

    </header>



    <!-- CHECK-IN -->

    <main>

        <section class="checkin-page">

            <div class="checkin-card">


                <div class="success-icon">
                    ✓
                </div>


                <p class="eyebrow">
                    HOSTEL MESS
                </p>


                <h1 id="heading">
                    Checking you in...
                </h1>


                <p
                    id="message"
                    class="checkin-message"
                >
                    Please wait while your scan
                    is recorded.
                </p>


                <a
                    href="index.html"
                    class="back-button"
                >
                    View Live Count
                </a>


            </div>

        </section>

    </main>



    <!-- FIREBASE CONFIG -->

    <script src="firebase-config.js"></script>


    <script>

        /*
        ========================================
        FIREBASE
        ========================================
        */

        firebase.initializeApp(
            MESS_FIREBASE_CONFIG
        );


        const database =
            firebase.database();



        /*
        ========================================
        GET UNIQUE BROWSER ID
        ========================================
        */

        function getBrowserID() {

            let id =
                localStorage.getItem(
                    "mess_browser_id"
                );


            if (!id) {

                if (
                    window.crypto &&
                    crypto.randomUUID
                ) {

                    id =
                        crypto.randomUUID();

                } else {

                    id =
                        "id-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .substring(2);

                }


                localStorage.setItem(
                    "mess_browser_id",
                    id
                );

            }


            return id;

        }



        const browserID =
            getBrowserID();



        /*
        ========================================
        RECORD SCAN
        ========================================
        */

        database
            .ref(
                "scans/" + browserID
            )
            .set(
                firebase.database.ServerValue.TIMESTAMP
            )


            .then(
                function() {

                    document
                        .getElementById("heading")
                        .textContent =
                        "You're checked in!";


                    document
                        .getElementById("message")
                        .textContent =
                        "Your scan has been counted. "
                        +
                        "You can now close this page.";

                }
            )


            .catch(
                function(error) {

                    console.error(error);


                    document
                        .getElementById("heading")
                        .textContent =
                        "Check-in failed";


                    document
                        .getElementById("message")
                        .textContent =
                        "Something went wrong. "
                        +
                        "Please scan the QR code again.";

                }
            );

    </script>


</body>

</html>
